name: CI

on:
  push:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: Build, Test, Sonar (push)
    runs-on: ubuntu-latest
    # environment: sonarcloud  # Descomente se usar environment secrets
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Build + Test + Coverage (Jacoco)
        run: mvn -B verify
      
      - name: SonarCloud (Quality Gate obrigatório)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: |
          if [ -z "$SONAR_ORGANIZATION" ] || [ -z "$SONAR_PROJECT_KEY" ] || [ -z "$SONAR_TOKEN" ]; then
            echo "❌ Erro: Secrets do SonarCloud não configurados"
            exit 1
          fi
          
          mvn -B sonar:sonar \
            -Dsonar.organization="$SONAR_ORGANIZATION" \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.login="$SONAR_TOKEN"
      
      - name: Upload relatórios de teste e cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage
          path: |
            target/surefire-reports/**
            target/site/**
          retention-days: 15
      
      - name: Upload JAR gerado
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: scaffold-cli-jar
          path: target/scaffold-cli.jar
          retention-days: 7
