name: PR Validation

on:
  pull_request:
    branches: [ main, develop ]
    types: [ opened, synchronize, reopened ]

jobs:
  validate-pr:
    name: Validate Pull Request
    runs-on: ubuntu-latest
    concurrency:
      group: pr-${{ github.event.pull_request.number || github.ref }}-validation
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      security-events: read
    
    steps:
      - name: Checkout código (com histórico)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      
      # Dependency Review desabilitado - habilitar em Settings > Security > Dependency graph
      # - name: Dependency Review (PR)
      #   uses: actions/dependency-review-action@v4
      
      - name: Validar Conventional Commits (aceita emoji opcional no início)
        id: validate-commits
        run: |
          merge_base=$(git merge-base origin/${{ github.base_ref }} HEAD 2>/dev/null || true)
          if [ -z "$merge_base" ]; then
            commits=$(git log origin/${{ github.base_ref }}..HEAD --pretty=format:"%s" 2>/dev/null || true)
          else
            commits=$(git log "$merge_base"..HEAD --pretty=format:"%s" 2>/dev/null || true)
          fi

          if [ -z "$commits" ]; then
            echo "⚠️ Nenhum commit novo encontrado para validar"
            exit 0
          fi

          invalid_commits=0
          total_commits=0

          while IFS= read -r commit_msg || [ -n "$commit_msg" ]; do
            commit_msg=$(echo "$commit_msg" | xargs)
            [ -z "$commit_msg" ] && continue

            if echo "$commit_msg" | grep -qE "^Merge (branch|pull request|.+ into .+)"; then
              continue
            fi

            total_commits=$((total_commits + 1))

            # Valida formato Conventional Commits (permite emoji opcional no início)
            # Aceita: [emoji?]tipo(escopo?): descrição
            if echo "$commit_msg" | grep -qE "^(feat|fix|docs|style|refactor|test|chore|perf|ci|build|revert)(\([^)]+\))?: .+"; then
              echo "✅ $commit_msg"
            elif echo "$commit_msg" | grep -qE "^[^[:space:]]+ (feat|fix|docs|style|refactor|test|chore|perf|ci|build|revert)(\([^)]+\))?: .+"; then
              # Permite emoji ou outro caractere no início seguido de espaço
              echo "✅ $commit_msg"
            else
              echo "❌ $commit_msg"
              echo "   Formato esperado: [emoji?]tipo(escopo?): descrição"
              echo "   Tipos válidos: feat, fix, docs, style, refactor, test, chore, perf, ci, build, revert"
              invalid_commits=$((invalid_commits + 1))
            fi
          done <<< "$commits"

          echo "Total: $total_commits | Inválidos: $invalid_commits"

          if [ $invalid_commits -gt 0 ]; then
            echo "❌ Encontrados $invalid_commits commit(s) fora do padrão (emoji opcional suportado)."
            exit 1
          fi
      
      - name: Build + Test + Coverage (Jacoco)
        id: verify
        continue-on-error: false
        run: |
          echo "Executando build, testes e verificação de cobertura..."
          mvn -B verify || {
            echo "❌ Build/Test/Coverage falhou. Verifique os logs acima."
            exit 1
          }
      
      - name: SonarCloud (Quality Gate obrigatório)
        id: sonar
        run: |
          echo "Executando análise SonarCloud..."
          echo "Verificando variáveis de ambiente..."
          
          mvn -B sonar:sonar \
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }} \
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }} \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }} || {
            echo "❌ SonarCloud falhou ou Quality Gate não passou"
            exit 1
          }
      
      - name: Comentário no PR
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const status = '${{ job.status }}' === 'success' ? '✅' : '❌';
            const summary = `${status} **Validação concluída**

            - Build/Tests/Verify: ${{ steps.verify.outcome || 'skipped' }}
            - SonarCloud: ${{ steps.sonar.outcome || 'skipped' }}
            - Conventional Commits: ${{ steps.validate-commits.outcome || 'skipped' }}
            `;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              (comment.body.includes('Validação concluída'))
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: summary,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: summary,
              });
            }
