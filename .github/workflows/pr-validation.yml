name: PR Validation

on:
  pull_request:
    branches: [ main, develop ]
    types: [ opened, synchronize, reopened ]

jobs:
  validate-pr:
    name: Validate Pull Request
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for better analysis
      
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Validar Conventional Commits
        run: |
          echo "Validando mensagens de commit..."
          git log origin/${{ github.base_ref }}..HEAD --pretty=format:"%s" | while read commit_msg; do
            if ! echo "$commit_msg" | grep -qE "^(feat|fix|docs|style|refactor|test|chore|perf|ci|build|revert)(\(.+\))?: .+"; then
              echo "❌ Commit inválido: $commit_msg"
              echo "Por favor, use Conventional Commits: tipo(escopo): descrição"
              echo "Tipos válidos: feat, fix, docs, style, refactor, test, chore, perf, ci, build, revert"
              exit 1
            fi
          done
          echo "✅ Todos os commits seguem Conventional Commits"
      
      - name: Compilar projeto
        run: mvn clean compile -B
      
      - name: Executar testes
        run: mvn test -B
      
      - name: Verificar build
        run: mvn verify -B
      
      - name: Comentário no PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('✅ Validação concluída')
            );
            
            const status = '${{ job.status }}' === 'success' ? '✅' : '❌';
            const body = `${status} **Validação concluída**
            
            - ✅ Compilação: ${{ job.status }}
            - ✅ Testes: ${{ job.status }}
            - ✅ Build: ${{ job.status }}
            `;
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

