name: PR Validation

on:
  pull_request:
    branches: [ main, develop ]
    types: [ opened, synchronize, reopened ]

jobs:
  validate-pr:
    name: Validate Pull Request
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for better analysis
      
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Validar Conventional Commits
        id: validate-commits
        run: |
          echo "Validando mensagens de commit..."
          echo "Base branch: ${{ github.base_ref }}"
          echo "Head SHA: ${{ github.event.pull_request.head.sha }}"
          echo "Base SHA: ${{ github.event.pull_request.base.sha }}"
          
          # Fetch completo do histórico
          git fetch --unshallow origin || git fetch origin || true
          git fetch origin ${{ github.base_ref }}:${{ github.base_ref }} || true
          
          # Obter commits do PR - tentar múltiplos métodos
          base_ref="${{ github.base_ref }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          base_sha="${{ github.event.pull_request.base.sha }}"
          
          commits=""
          
          # Método 1: Usar SHA se disponível
          if [ -n "$base_sha" ] && [ -n "$head_sha" ]; then
            echo "Tentando obter commits usando SHA..."
            commits=$(git log $base_sha..$head_sha --pretty=format:"%s" 2>/dev/null || echo "")
          fi
          
          # Método 2: Usar branch names
          if [ -z "$commits" ]; then
            echo "Tentando obter commits usando branch names..."
            commits=$(git log origin/$base_ref..HEAD --pretty=format:"%s" 2>/dev/null || echo "")
          fi
          
          # Método 3: Usar merge-base
          if [ -z "$commits" ]; then
            echo "Tentando obter commits usando merge-base..."
            merge_base=$(git merge-base origin/$base_ref HEAD 2>/dev/null || echo "")
            if [ -n "$merge_base" ]; then
              commits=$(git log $merge_base..HEAD --pretty=format:"%s" 2>/dev/null || echo "")
            fi
          fi
          
          if [ -z "$commits" ]; then
            echo "⚠️ Nenhum commit encontrado para validar"
            echo "Listando últimos 10 commits para debug:"
            git log --oneline -10 || true
            echo ""
            echo "Branches disponíveis:"
            git branch -a || true
            exit 0
          fi
          
          echo "Commits encontrados para validação:"
          echo "$commits"
          echo ""
          
          invalid_commits=0
          while IFS= read -r commit_msg || [ -n "$commit_msg" ]; do
            # Remove espaços em branco e caracteres especiais
            commit_msg=$(echo "$commit_msg" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            if [ -n "$commit_msg" ] && [ "$commit_msg" != "" ]; then
              # Regex para Conventional Commits: tipo(escopo opcional): descrição
              if echo "$commit_msg" | grep -qE "^(feat|fix|docs|style|refactor|test|chore|perf|ci|build|revert)(\([^)]+\))?: .+"; then
                echo "✅ Commit válido: $commit_msg"
              else
                echo "❌ Commit inválido: $commit_msg"
                echo "   Formato esperado: tipo(escopo): descrição"
                echo "   Tipos válidos: feat, fix, docs, style, refactor, test, chore, perf, ci, build, revert"
                invalid_commits=$((invalid_commits + 1))
              fi
            fi
          done <<< "$commits"
          
          if [ $invalid_commits -gt 0 ]; then
            echo ""
            echo "❌ Encontrados $invalid_commits commit(s) inválido(s)"
            exit 1
          fi
          echo ""
          echo "✅ Todos os commits seguem Conventional Commits"
      
      - name: Compilar projeto
        id: compile
        run: mvn clean compile -B
      
      - name: Executar testes
        id: test
        run: mvn test -B
      
      - name: Verificar build
        id: verify
        run: mvn verify -B
      
      - name: Comentário no PR
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });
              
              const botComment = comments.find(comment => 
                comment.user.type === 'Bot' && 
                (comment.body.includes('✅ Validação concluída') || comment.body.includes('❌ Validação concluída'))
              );
              
              const status = '${{ job.status }}' === 'success' ? '✅' : '❌';
              const body = `${status} **Validação concluída**
              
              - Compilação: ${{ steps.compile.outcome || 'skipped' }}
              - Testes: ${{ steps.test.outcome || 'skipped' }}
              - Build: ${{ steps.verify.outcome || 'skipped' }}
              - Conventional Commits: ${{ steps.validate-commits.outcome || 'skipped' }}
              `;
              
              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body: body
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: body
                });
              }
            } catch (error) {
              console.log('Erro ao comentar no PR:', error.message);
              // Não falha o workflow se não conseguir comentar
            }

