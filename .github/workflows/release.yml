name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Extrair versão da tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Tag version: $VERSION"
      
      - name: Verificar versão no pom.xml
        run: |
          POM_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          TAG_VERSION=${{ steps.version.outputs.version }}
          if [ "$POM_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ Erro: Versão no pom.xml ($POM_VERSION) não corresponde à tag ($TAG_VERSION)"
            exit 1
          fi
          echo "✅ Versão verificada: $POM_VERSION"
      
      - name: Compilar projeto
        run: mvn clean package -B
      
      - name: Executar testes
        run: mvn test -B
      
      - name: Verificar build completo
        run: mvn verify -B
      
      - name: Verificar JAR gerado
        run: |
          if [ ! -f target/scaffold-cli.jar ]; then
            echo "❌ Erro: JAR não foi gerado"
            exit 1
          fi
          ls -lh target/scaffold-cli.jar
          echo "✅ JAR gerado com sucesso"
      
      # SonarCloud pode ser pulado na release para agilizar (já rodou no push).

      - name: Criar Release no GitHub
        uses: softprops/action-gh-release@v1
        with:
          files: target/scaffold-cli.jar
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


