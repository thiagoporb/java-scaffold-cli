# ============================================================
# Grafana - Configuração de Dashboards
# ============================================================
# Provisiona automaticamente dashboards ao iniciar
# ============================================================

apiVersion: 1

providers:
  - name: 'default'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards

