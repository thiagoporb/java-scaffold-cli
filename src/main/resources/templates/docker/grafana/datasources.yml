# ============================================================
# Grafana - Configuração de Datasources
# ============================================================
# Provisiona automaticamente as fontes de dados ao iniciar
# ============================================================

apiVersion: 1

datasources:
  # ============================================================
  # Prometheus - Métricas
  # ============================================================
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  # ============================================================
  # Jaeger - Traces
  # ============================================================
  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: false

